apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: hetzner
  data:
    - secretKey: hcloud
      remoteRef:
        key: apikeys/hetzner/{{ .Values.hetznerProject }}
