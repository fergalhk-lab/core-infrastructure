apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerCluster
metadata:
  name: {{ .Release.Name }}
spec:
  controlPlaneEndpoint:
    host: ""
    port: 443
  controlPlaneLoadBalancer:
    region: {{ .Values.hetzner.region }}
  controlPlaneRegions:
  - {{ .Values.hetzner.region }}
  hcloudNetwork:
    enabled: false
  hcloudPlacementGroups:
  - name: control-plane
    type: spread
  - name: md-0
    type: spread
  hetznerSecretRef:
    key:
      hcloudToken: hcloud
      hetznerRobotPassword: robot-password
      hetznerRobotUser: robot-user
    name: {{ .Values.hetzner.secretName }}
  sshKeys:
    hcloud:
    - name: {{ .Values.hetzner.sshKeyName }}
