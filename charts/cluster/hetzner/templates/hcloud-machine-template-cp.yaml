  name: {{ .Values.clusterName }}-control-plane
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      imageName: ubuntu-24.04
      placementGroupName: control-plane
      type: {{ .Values.controlPlane.machineType }}
