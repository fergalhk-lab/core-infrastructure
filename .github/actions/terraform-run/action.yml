name: Terraform Run
description: Init and run terraform plan or apply for a given root module directory

inputs:
  directory:
    description: Relative path to the terraform root module directory
    required: true
  command:
    description: Terraform subcommand to run after init (plan or apply)
    required: true
  role_to_assume:
    description: IAM role ARN to assume via OIDC (omit for non-AWS modules)
    required: false
  aws_region:
    description: AWS region (required when role_to_assume is set)
    required: false
  cloudflare_api_token:
    description: API token for Cloudflare
    required: true
  hcloud_token:
    description: API token for Hetzner cloud
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      if: ${{ inputs.role_to_assume != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        aws-region: ${{ inputs.aws_region }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform init
      shell: bash
      run: util/terraform.sh "${{ inputs.directory }}" init

    - name: Terraform ${{ inputs.command }}
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: "${{inputs.cloudflare_api_token}}"
        HCLOUD_TOKEN: "${{ inputs.hcloud_token }}"
      run: |
        if [[ "${{ inputs.command }}" == "plan" ]]; then
          util/terraform.sh "${{ inputs.directory }}" plan -out=plan.tfplan
        else
          util/terraform.sh "${{ inputs.directory }}" apply plan.tfplan
        fi
