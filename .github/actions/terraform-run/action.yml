name: Terraform Run
description: Init and run terraform plan or apply for a given root module directory

inputs:
  directory:
    description: Relative path to the terraform root module directory
    required: true
  command:
    description: Terraform subcommand to run after init (plan or apply)
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::740994137039:role/github-core-infrastructure
        aws-region: eu-west-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform init
      shell: bash
      run: util/terraform.sh "${{ inputs.directory }}" init

    - name: Terraform ${{ inputs.command }}
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: "${{inputs.cloudflare_api_token}}"
        HCLOUD_TOKEN: "${{ inputs.hcloud_token }}"
      run: |
        if [[ "${{ inputs.command }}" == "plan" ]]; then
          util/terraform.sh "${{ inputs.directory }}" plan -out=plan.tfplan
        else
          util/terraform.sh "${{ inputs.directory }}" apply plan.tfplan
        fi

    - name: Setup Go
      if: inputs.command == 'plan'
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Write plan summary
      if: inputs.command == 'plan'
      shell: bash
      env:
        TF_DIR: ${{ inputs.directory }}
      run: |
        {
          echo "## Plan: ${TF_DIR}"
          echo ""
          util/terraform.sh "${TF_DIR}" show -json plan.tfplan \
            | go run ./util/terraform-plan-summary
          echo ""
          echo "### Full Plan"
          echo '```hcl'
          util/terraform.sh "${TF_DIR}" show -no-color plan.tfplan
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
