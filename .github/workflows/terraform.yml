name: Run Terraform

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate matrix
        id: generate
        run: |
          matrix=$(go run ./util/terraform-matrix-generator)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  plan:
    needs: generate-matrix
    runs-on: ubuntu-latest
    name: plan (${{ matrix.dir }})
    concurrency:
      group: terraform-${{ matrix.dir }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set artifact name
        id: meta
        run: echo "artifact=tfplan-$(echo '${{ matrix.dir }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        uses: ./.github/actions/terraform-run
        with:
          directory: ${{ matrix.dir }}
          command: plan
          role_to_assume: ${{ matrix.roleARN }}
          aws_region: ${{ matrix.awsRegion }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN_BUILD }}

      - name: Upload plan artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ matrix.dir }}/plan.tfplan
          retention-days: 1

  apply-gate:
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: terraform-apply
    steps:
      - run: echo "Approved"

  apply:
    needs: [generate-matrix, apply-gate]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    name: apply (${{ matrix.dir }})
    concurrency:
      group: terraform-${{ matrix.dir }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set artifact name
        id: meta
        run: echo "artifact=tfplan-$(echo '${{ matrix.dir }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ matrix.dir }}

      - name: Terraform apply
        uses: ./.github/actions/terraform-run
        with:
          directory: ${{ matrix.dir }}
          command: apply
          role_to_assume: ${{ matrix.roleARN }}
          aws_region: ${{ matrix.awsRegion }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN_BUILD }}
