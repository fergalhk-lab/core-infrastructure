name: Run Terraform

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate matrix
        id: generate
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          all_modules=$(yq -o=json -I=0 '.modules' config/terraform.yaml)

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              include_all=true
              ;;
            pull_request)
              changed_dirs=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
              include_all=false
              ;;
            push)
              changed_dirs=$(git diff --name-only "${BEFORE_SHA}..${GITHUB_SHA}")
              include_all=false
              ;;
          esac

          if [[ "$include_all" == "true" ]]; then
            matrix=$(echo "$all_modules" | jq -c '[.[] | {"dir": .}]')
          else
            matrix=$(echo "$all_modules" | jq -c --arg changed "$changed_dirs" \
              '[.[] | rtrimstr("/") as $m | select(($changed | split("\n") | map(. == $m or startswith($m + "/")) | any))] | map({"dir": .})')
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  plan:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    name: plan (${{ matrix.dir }})
    concurrency:
      group: terraform-${{ matrix.dir }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Terraform plan
        uses: ./.github/actions/terraform-run
        with:
          directory: ${{ matrix.dir }}
          command: plan

      - name: Upload plan to S3
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          aws s3 cp "${{ matrix.dir }}/plan.tfplan" \
            "s3://fergalhk-terraform-state/plans/${{ github.run_id }}/${{ matrix.dir }}/plan.tfplan"

  apply:
    needs: [generate-matrix, plan]
    if: needs.generate-matrix.outputs.matrix != '[]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    name: apply (${{ matrix.dir }})
    environment: terraform-apply
    concurrency:
      group: terraform-${{ matrix.dir }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::740994137039:role/github-core-infrastructure
          aws-region: eu-west-1

      - name: Download plan from S3
        run: |
          aws s3 cp \
            "s3://fergalhk-terraform-state/plans/${{ github.run_id }}/${{ matrix.dir }}/plan.tfplan" \
            "${{ matrix.dir }}/plan.tfplan"

      - name: Terraform apply
        uses: ./.github/actions/terraform-run
        with:
          directory: ${{ matrix.dir }}
          command: apply

      - name: Delete plan from S3
        if: success()
        run: |
          aws s3 rm \
            "s3://fergalhk-terraform-state/plans/${{ github.run_id }}/${{ matrix.dir }}/plan.tfplan"
