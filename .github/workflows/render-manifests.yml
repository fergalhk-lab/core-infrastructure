name: Render Manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: push-manifests
  cancel-in-progress: false

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix
        id: generate
        run: |
          matrix="$(
            ls cluster-config/*/charts/*.yaml | \
            jq -Rsc '[
              split("\n")[:-1][] |
              split("/") |
              { cluster: .[1], name: (.[3] | rtrimstr(".yaml")) }
            ]'
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  render:
    needs: generate-matrix
    runs-on: ubuntu-latest
    name: render (${{ matrix.cluster }}/${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Render manifests
        run: |
          bash util/render-chart.sh \
            "cluster-config/${{ matrix.cluster }}/charts/${{ matrix.name }}.yaml" \
            > rendered.yaml

      - name: Stage manifest
        run: |
          mkdir -p "staged/${{ matrix.cluster }}/${{ matrix.name }}"
          cp rendered.yaml "staged/${{ matrix.cluster }}/${{ matrix.name }}/manifest.yaml"

      - name: Upload rendered manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.cluster }}-${{ matrix.name }}
          path: staged/

  diff:
    needs: render
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/github-app-token
        with:
          repositories: k8s-deployments

      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: fergalhk-lab/k8s-deployments
          path: manifests-repo
          token: ${{ steps.app-token.outputs.token }}

      - name: Download all rendered manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          merge-multiple: true
          path: rendered

      - name: Diff manifests
        run: |
          while IFS= read -r f; do
            cluster=$(echo "$f" | cut -d/ -f2)
            name=$(echo "$f" | cut -d/ -f3)
            current="manifests-repo/$cluster/$name/manifest.yaml"
            {
              echo "## \`$cluster/$name\`"
              echo '```diff'
              if [[ -f "$current" ]]; then
                diff -u "$current" "$f" || true
              else
                echo "(new chart — no existing manifest)"
                cat "$f"
              fi
              echo '```'
            }
          done < <(find rendered -name 'manifest.yaml' | sort)

  push-manifests:
    needs: [generate-matrix, render]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/github-app-token
        with:
          repositories: k8s-deployments

      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: fergalhk-lab/k8s-deployments
          token: ${{ steps.app-token.outputs.token }}

      - name: Download all rendered manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          merge-multiple: true
          path: staged

      - name: Commit and push manifests
        run: |
          cp -r staged/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: render manifests from ${{ github.repository }}@${{ github.sha }}"
            git push
          fi
