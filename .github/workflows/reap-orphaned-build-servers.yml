name: Reap orphaned packer build servers

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Delete servers
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_BUILD }}
        run: go run ./util/reap-orphaned-servers -label-selector 'type=packer-build' -max-age 2h
