name: kube-prometheus-stack
chart:
  source: https://prometheus-community.github.io/helm-charts
  name: kube-prometheus-stack
  version: 82.18.0
values:
  grafana:
    enabled: true

    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password

    envFromSecret: grafana-github-oauth

    env:
      GF_AUTH_GITHUB_ENABLED: "true"
      GF_AUTH_GITHUB_SCOPES: "user:email,read:org"
      GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS: "fergalhk-lab"
      GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH: "'Admin'"
      GF_AUTH_GITHUB_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://grafana.fergal.website"

    initChownData:
      enabled: false

    persistence:
      enabled: true
      size: 1Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.fergal.website
      tls:
        - hosts:
            - grafana.fergal.website

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 256Mi

  # AlertManager disabled — no alerting configured yet.
  alertmanager:
    enabled: false

  prometheus:
    prometheusSpec:
      retention: 7d

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi

      resources:
        requests:
          cpu: 75m
          memory: 1Gi
        limits:
          memory: 1Gi

  # kube-state-metrics and node-exporter are enabled by default.
  # The chart creates ServiceMonitors for both automatically.
  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi

  # prometheus-node-exporter is the sub-chart name; resources go here, not under nodeExporter:
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 32Mi

  prometheusOperator:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi

extraObjects:
  - apiVersion: generators.external-secrets.io/v1alpha1
    kind: Password
    metadata:
      name: grafana-admin-password
      namespace: kube-prometheus-stack
    spec:
      length: 64
      noUpper: false
      allowRepeat: true
      symbols: 0

  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-admin-credentials
      namespace: kube-prometheus-stack
    spec:
      refreshInterval: 0s
      dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              name: grafana-admin-password
      target:
        name: grafana-admin-credentials
        creationPolicy: Owner
        deletionPolicy: Retain
        template:
          data:
            admin-user: admin
            admin-password: "{{ .password }}"

  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-github-oauth
      namespace: kube-prometheus-stack
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: aws-secrets-manager
        kind: ClusterSecretStore
      target:
        name: grafana-github-oauth
        creationPolicy: Owner
        deletionPolicy: Retain
        template:
          data:
            GF_AUTH_GITHUB_CLIENT_ID: "{{ .client_id }}"
            GF_AUTH_GITHUB_CLIENT_SECRET: "{{ .client_secret }}"
      data:
        - secretKey: client_id
          remoteRef:
            key: apikeys/github-oauth/grafana
            property: client_id
        - secretKey: client_secret
          remoteRef:
            key: apikeys/github-oauth/grafana
            property: client_secret
