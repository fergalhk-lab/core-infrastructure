name: mimir
namespace: mimir
chart:
  source: https://grafana.github.io/helm-charts
  name: mimir-distributed
  version: 6.0.6
values:
  # MinIO is bundled for development use — disabled here as we use S3.
  minio:
    enabled: false

  # Kafka is bundled for the experimental ingest storage write path — not needed
  # with an S3 backend.
  kafka:
    enabled: false

  # Rollout operator manages rolling upgrades across zones — not needed for a
  # single-replica deployment.
  rollout_operator:
    enabled: false

  # Tradeoff: singleBinary mode was removed in chart 6.x. We run each component
  # with a single replica and zone-aware replication disabled, which gives an
  # effectively monolithic deployment. For higher availability, enable
  # zoneAwareReplication and increase replicas per component.
  # See: https://grafana.com/docs/helm-charts/mimir-distributed/latest/

  # IRSA wiring: injects AWS credentials via OIDC projected token into all
  # component pods. Same pattern as external-secrets. A pod identity webhook
  # would make this automatic — see the TODO in external-secrets.yaml.
  global:
    extraEnv:
      - name: AWS_ROLE_ARN
        value: arn:aws:iam::740994137039:role/k8s-mgmt-mimir-mimir
      - name: AWS_WEB_IDENTITY_TOKEN_FILE
        value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
    extraVolumes:
      - name: aws-iam-token
        projected:
          sources:
            - serviceAccountToken:
                audience: sts.amazonaws.com
                expirationSeconds: 86400
                path: token
    extraVolumeMounts:
      - name: aws-iam-token
        mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
        readOnly: true

  ingester:
    replicas: 1
    # Tradeoff: zone-aware replication disabled — defaults to 3 zones, which
    # requires 3 nodes and replication_factor: 3. Re-enable for HA.
    zoneAwareReplication:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  distributor:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  querier:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  query_frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  query_scheduler:
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 64Mi

  store_gateway:
    replicas: 1
    # Tradeoff: zone-aware replication disabled — same as ingester above.
    zoneAwareReplication:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  compactor:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  ruler:
    replicas: 0

  alertmanager:
    replicas: 0

  mimir:
    structuredConfig:
      # Single-tenant mode. To support multiple tenants later, set this to true
      # and add X-Scope-OrgID headers to the Prometheus remote_write config.
      multitenancy_enabled: false

      # Disable the Kafka-based ingest storage path — enabled by default in
      # chart 6.x but not needed with an S3 backend.
      ingest_storage:
        enabled: false

      blocks_storage:
        s3:
          bucket_name: fergalhk-mimir
          region: eu-west-1
          endpoint: s3.eu-west-1.amazonaws.com

      usage_stats:
        enabled: false

      common:
        storage:
          backend: s3
          s3:
            bucket_name: fergalhk-mimir
            region: eu-west-1
            # No credentials configured — the AWS SDK picks them up from
            # the IRSA env vars injected above.

      # Required for single-replica operation.
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1

      store_gateway:
        sharding_ring:
          replication_factor: 1

      # Required for single-replica compactor.
      compactor:
        sharding_ring:
          wait_stability_min_duration: 0
