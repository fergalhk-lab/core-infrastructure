apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationsets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fergalhk-lab/core-infrastructure
    targetRevision: HEAD
    path: charts/applicationset
    helm:
      values: |
        applicationSets:
          deployments:
            repoURL: https://github.com/fergalhk-lab/k8s-deployments
            directoryPath: clusters/*/*
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
