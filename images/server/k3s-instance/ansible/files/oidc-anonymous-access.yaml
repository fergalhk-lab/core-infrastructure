# -- Allow anonymous access to public OIDC endpoints
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-discovery
rules:
  - nonResourceURLs:
      - "/.well-known/openid-configuration"
      - "/openid/v1/jwks"
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-discovery-anonymous
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oidc-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:anonymous
---
# -- Forward requests on 443 for issuer JWKS endpoints to k8s api server
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: skip-backend-verify
  namespace: default
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-api-ingress
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # Replace ISSUER_HOSTNAME via templating
    - match: Host(`ISSUER_HOSTNAME`) && (Path(`/.well-known/openid-configuration`) || Path(`/openid/v1/jwks`))
      kind: Rule
      services:
        - name: kubernetes
          port: 443
          scheme: https
          serversTransport: skip-backend-verify
