- name: "Provision PostgreSQL instance"
  hosts: default
  become: true

  roles:
    - common

  tasks:
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download PostgreSQL apt signing key
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/postgresql.asc
        mode: "0644"

    - name: Add PostgreSQL apt repository
      ansible.builtin.copy:
        content: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main\n"
        dest: /etc/apt/sources.list.d/pgdg.list
        mode: "0644"

    - name: Install PostgreSQL
      ansible.builtin.apt:
        name: "postgresql-{{ pg_version }}"
        state: present
        update_cache: true

    - name: Enable PostgreSQL service
      ansible.builtin.systemd_service:
        name: postgresql
        enabled: true
